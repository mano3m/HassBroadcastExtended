[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hass-broadcast-extended"
version = "0.1.5"
description = "Extend Home Assistant Intent HassBroadcast to broadcast to media players."
readme = "README.md"
requires-python = ">=3.14.2"
license = "Apache-2.0"
dependencies = [
  "homeassistant>=2026.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PYI",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
  "W",
]
ignore = [
  "E501",
  "S101",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]

[tool.mypy]
python_version = "3.14"
plugins = []
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true
files = ["custom_components", "tests"]
